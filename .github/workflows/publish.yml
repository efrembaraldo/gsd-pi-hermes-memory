name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (skip actual publish)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  workflow_run:
    workflows: ["CI"] # deve combaciare col `name:` di ci.yml
    types:
      - completed
    branches: [main]

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    # workflow_run si attiva su QUALSIASI esito di CI (success, failure,
    # cancelled, ...), non solo su success. Senza questo guard, publish
    # partirebbe anche quando CI è fallita. Per workflow_dispatch (manuale)
    # la condizione è sempre vera: comportamento invariato per quel trigger.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Check for uncommitted changes
        run: git diff --exit-code

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: publish
    # Trusted Publishing via OIDC: replace the classic `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`
    # pattern (which requires a long-lived npm automation token to be stored as a repo
    # secret) with npm's GitHub Actions OIDC trust flow. This mirrors the setup in
    # efrembaraldo/gsd-pi-discussion-arena: `id-token: write` lets actions/setup-node
    # exchange the workflow identity for a short-lived npm token, `--provenance`
    # tells npm to use that token (and attach a signed build provenance statement).
    # The counterpart on the npm side is a Trusted Publisher entry on the package
    # config page (https://www.npmjs.com/package/@efrembaraldo/gsd-pi-hermes-memory
    # → Settings → Trusted Publishers) authorizing this repo + workflow file.
    permissions:
      contents: read
      id-token: write # required for npm provenance / Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify version not already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@efrembaraldo/gsd-pi-hermes-memory@$VERSION" version >/dev/null 2>&1; then
            echo "::error::Version @efrembaraldo/gsd-pi-hermes-memory@$VERSION is already published. Bump version in package.json first."
            exit 1
          fi
          echo "Version $VERSION is not yet published, proceeding."

      # workflow_run/release non hanno github.event.inputs (esiste solo per
      # workflow_dispatch) — senza questa distinzione esplicita, nessuna
      # delle due condizioni sarebbe vera quando CI attiva il publish da
      # sola, e non partirebbe né il publish reale né il dry-run.
      - name: Publish
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run == 'false'
        run: npm publish --provenance --access public

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true'
        run: npm publish --dry-run --provenance --access public
