name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Consente il run manuale via `gh workflow run` (e serve anche perché
  # publish.yml si aggancia a questo workflow via workflow_run — quel
  # trigger osserva CI dall'esterno e non richiede workflow_dispatch qui,
  # lo aggiungiamo comunque per poter rilanciare CI a mano quando serve).
  # Senza questo trigger, `gh workflow run ci.yml` fallisce con HTTP 422
  # "Workflow does not have 'workflow_dispatch' trigger".
  workflow_dispatch:

jobs:
  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

  min-sdk:
    name: Min Supported SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # The `check` job installs whatever the devDependency range resolves to,
      # which is always new enough to hide a broken peerDependencies floor.
      # This one type-checks against the oldest Pi we advertise support for.
      - run: npm ci

      - run: npm run check:min-sdk

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for uncommitted changes
        run: git diff --exit-code
